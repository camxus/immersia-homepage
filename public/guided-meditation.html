    <script>
      // ---------- Real human base mesh (from uploaded FBX, split into rigged parts) ----------
      const BODY_PARTS = JSON.parse(
        document.getElementById("body-parts-data").textContent,
      );

      function b64ToFloat32(b64) {
        const bin = atob(b64);
        const buf = new ArrayBuffer(bin.length);
        const view = new Uint8Array(buf);
        for (let i = 0; i < bin.length; i++) view[i] = bin.charCodeAt(i);
        return new Float32Array(buf);
      }
      function b64ToUint32(b64) {
        const bin = atob(b64);
        const buf = new ArrayBuffer(bin.length);
        const view = new Uint8Array(buf);
        for (let i = 0; i < bin.length; i++) view[i] = bin.charCodeAt(i);
        return new Uint32Array(buf);
      }

      function buildBodyGeometries() {
        const parts = {};
        for (const name of ["torso", "legs", "head", "armL", "armR"]) {
          const d = BODY_PARTS[name];
          const geo = new THREE.BufferGeometry();
          geo.setAttribute(
            "position",
            new THREE.BufferAttribute(b64ToFloat32(d.pos_b64), 3),
          );
          geo.setAttribute(
            "normal",
            new THREE.BufferAttribute(b64ToFloat32(d.norm_b64), 3),
          );
          geo.setIndex(new THREE.BufferAttribute(b64ToUint32(d.idx_b64), 1));
          parts[name] = { geometry: geo, pivot: d.pivot };
        }
        return parts;
      }

      // ---------- Real stretching-figure mesh (from uploaded USDZ) ----------
      const STRETCH_FIGURE = JSON.parse(
        document.getElementById("stretch-figure-data").textContent,
      );
      function buildStretchGeometry() {
        const geo = new THREE.BufferGeometry();
        geo.setAttribute(
          "position",
          new THREE.BufferAttribute(b64ToFloat32(STRETCH_FIGURE.pos_b64), 3),
        );
        geo.setAttribute(
          "normal",
          new THREE.BufferAttribute(b64ToFloat32(STRETCH_FIGURE.norm_b64), 3),
        );
        geo.setIndex(
          new THREE.BufferAttribute(b64ToUint32(STRETCH_FIGURE.idx_b64), 1),
        );
        return geo;
      }

      // ---------- Shared scene builder ----------
      const ROOM_DEPTH = 9; // used only as a generic reference distance for camera targets
      const ROOM_WIDTH = 9;
      const WALL_H = 5;

      function buildScene() {
        const scene = new THREE.Scene();
        scene.background = null;

        // lights
        const hemi = new THREE.HemisphereLight(0xffffff, 0x333333, 0.9);
        scene.add(hemi);
        const dir = new THREE.DirectionalLight(0xffffff, 0.8);
        dir.position.set(8, 14, 6);
        scene.add(dir);
        const dir2 = new THREE.DirectionalLight(0xffffff, 0.35);
        dir2.position.set(-10, 6, -8);
        scene.add(dir2);

        const wallMat = new THREE.MeshStandardMaterial({
          color: 0x000000,
          roughness: 0.9,
          metalness: 0.05,
          transparent: true,
          opacity: 0.22,
          depthWrite: false,
          side: THREE.DoubleSide,
        });
        const wallLineMat = new THREE.LineBasicMaterial({ color: 0x000000 });
        const floorMat = new THREE.MeshStandardMaterial({
          color: 0xf2f2f2,
          roughness: 1,
        });
        const matMat = new THREE.MeshStandardMaterial({
          color: 0x1a1a1a,
          roughness: 0.9,
        });
        const consoleMat = new THREE.MeshStandardMaterial({
          color: 0x2a2a2a,
          roughness: 0.7,
        });
        const screenGlow = new THREE.MeshBasicMaterial({ color: 0xffffff });

        const ROOM_R = 7.5; // room radius at floor
        const ROOM_R_TOP = 9.2; // walls splay outward toward the ceiling
        const ROOM_H = 4.2;
        const SIDES = 8; // octagonal room, echoing the reference photo

        // floor: octagonal disc
        const floorShape = new THREE.Shape();
        for (let i = 0; i < SIDES; i++) {
          const a = (i / SIDES) * Math.PI * 2;
          const x = ROOM_R * Math.sin(a),
            z = ROOM_R * Math.cos(a);
          if (i === 0) floorShape.moveTo(x, z);
          else floorShape.lineTo(x, z);
        }
        floorShape.closePath();
        const floorGeo = new THREE.ShapeGeometry(floorShape);
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);
        
         // floor grid (1m)
        const grid = new THREE.GridHelper(
          Math.max(ROOM_WIDTH, ROOM_DEPTH),
          Math.max(ROOM_WIDTH, ROOM_DEPTH),
          0x222222,
          0xbbbbbb,
        );

        grid.position.set(0, 0.01, ROOM_DEPTH / 2);
        scene.add(grid);

        // walls: flared octagon segments (splayed outward, like the reference room)
        for (let i = 0; i < SIDES; i++) {
          const a0 = (i / SIDES) * Math.PI * 2;
          const a1 = ((i + 1) / SIDES) * Math.PI * 2;
          const bx0 = ROOM_R * Math.sin(a0),
            bz0 = ROOM_R * Math.cos(a0);
          const bx1 = ROOM_R * Math.sin(a1),
            bz1 = ROOM_R * Math.cos(a1);
          const tx0 = ROOM_R_TOP * Math.sin(a0),
            tz0 = ROOM_R_TOP * Math.cos(a0);
          const tx1 = ROOM_R_TOP * Math.sin(a1),
            tz1 = ROOM_R_TOP * Math.cos(a1);

          const verts = new Float32Array([
            bx0,
            0,
            bz0,
            bx1,
            0,
            bz1,
            tx1,
            ROOM_H,
            tz1,
            bx0,
            0,
            bz0,
            tx1,
            ROOM_H,
            tz1,
            tx0,
            ROOM_H,
            tz0,
          ]);
          const wallGeo = new THREE.BufferGeometry();
          wallGeo.setAttribute("position", new THREE.BufferAttribute(verts, 3));
          wallGeo.computeVertexNormals();
          const wall = new THREE.Mesh(wallGeo, wallMat);
          scene.add(wall);
          const edges = new THREE.EdgesGeometry(wallGeo, 5);
          scene.add(new THREE.LineSegments(edges, wallLineMat));
        }

        // ---- center: low platform with a CDJ / mixer DJ setup, cables radiating out ----
        const centerGroup = new THREE.Group();

        const pad = new THREE.Mesh(
          new THREE.BoxGeometry(1.5, 0.08, 0.9),
          matMat,
        );
        pad.position.y = 0.04;
        centerGroup.add(pad);

        const deckMat = new THREE.MeshStandardMaterial({
          color: 0x151515,
          roughness: 0.5,
          metalness: 0.3,
        });
        const jogMat = new THREE.MeshStandardMaterial({
          color: 0x2c2c2c,
          roughness: 0.4,
          metalness: 0.4,
        });
        const mixerMat = new THREE.MeshStandardMaterial({
          color: 0x1c1c1c,
          roughness: 0.5,
          metalness: 0.3,
        });
        const screenLit = new THREE.MeshBasicMaterial({ color: 0xffffff });

        function cdjDeck(x) {
          const g = new THREE.Group();
          const body = new THREE.Mesh(
            new THREE.BoxGeometry(0.44, 0.08, 0.44),
            deckMat,
          );
          body.position.y = 0.04;
          g.add(body);
          const jog = new THREE.Mesh(
            new THREE.CylinderGeometry(0.16, 0.16, 0.02, 24),
            jogMat,
          );
          jog.position.set(0, 0.09, 0.02);
          g.add(jog);
          const jogRing = new THREE.Mesh(
            new THREE.TorusGeometry(0.16, 0.008, 8, 24),
            deckMat,
          );
          jogRing.rotation.x = Math.PI / 2;
          jogRing.position.set(0, 0.1, 0.02);
          g.add(jogRing);
          const smallScreen = new THREE.Mesh(
            new THREE.PlaneGeometry(0.16, 0.09),
            screenLit,
          );
          smallScreen.rotation.x = -Math.PI / 2 + 0.35;
          smallScreen.position.set(0, 0.085, -0.16);
          g.add(smallScreen);
          g.position.set(x, 0.08, 0);
          return g;
        }

        centerGroup.add(cdjDeck(-0.42));
        centerGroup.add(cdjDeck(0.42));

        // central mixer between the two decks
        const mixer = new THREE.Mesh(
          new THREE.BoxGeometry(0.28, 0.09, 0.4),
          mixerMat,
        );
        mixer.position.set(0, 0.08 + 0.045, 0);
        centerGroup.add(mixer);
        for (let f = 0; f < 4; f++) {
          const fader = new THREE.Mesh(
            new THREE.BoxGeometry(0.02, 0.02, 0.14),
            jogMat,
          );
          fader.position.set(-0.09 + f * 0.06, 0.08 + 0.095, 0.02);
          centerGroup.add(fader);
        }
        const mixerScreen = new THREE.Mesh(
          new THREE.PlaneGeometry(0.14, 0.07),
          screenLit,
        );
        mixerScreen.rotation.x = -Math.PI / 2 + 0.3;
        mixerScreen.position.set(0, 0.08 + 0.09, -0.14);
        centerGroup.add(mixerScreen);

        scene.add(centerGroup);

        // radiating cables: thin dark lines from center to each mat position (set after mats computed)
        const cableMat = new THREE.LineBasicMaterial({ color: 0x111111 });

        // ---- crowd figures: real stretching-figure mesh, standing on each mat ----
        const stretchGeo = buildStretchGeometry();
        stretchGeo.computeBoundingBox();
        const STRETCH_HEIGHT =
          stretchGeo.boundingBox.max.y - stretchGeo.boundingBox.min.y;

        function seatedPerson(mx, mz, facingAngle) {
          const scale = (0.92 + Math.random() * 0.18) * (1.75 / STRETCH_HEIGHT);
          const tint = 0xf0f0f0 + Math.floor(Math.random() * 0x0f0f0f);
          const mat = new THREE.MeshStandardMaterial({
            color: tint,
            roughness: 0.75,
            flatShading: true,
          });

          const g = new THREE.Group();
          const figure = new THREE.Mesh(stretchGeo, mat);
          g.add(figure);
          g.scale.setScalar(scale);

          g.position.set(mx, 0.05 - stretchGeo.boundingBox.min.y * scale, mz);
          g.rotation.y = facingAngle + Math.PI; // model's front faces its local +Z; flip so it faces the given direction
          return g;
        }

        // sunburst mat layout: N directions, a couple of mats stacked outward per direction
        const N_DIR = 10;
        const MATS_PER_DIR = 2;
        const MAT_W = 0.75,
          MAT_L = 1.95;
        const startR = 2.5;
        const matSpacing = 2.05;
        const matGeo = new THREE.BoxGeometry(MAT_W, 0.05, MAT_L);
        const cablePoints = [];

        for (let i = 0; i < N_DIR; i++) {
          const angle =
            (i / N_DIR) * Math.PI * 2 + (Math.random() - 0.5) * 0.05;
          const dirX = Math.sin(angle),
            dirZ = Math.cos(angle);
          for (let m = 0; m < MATS_PER_DIR; m++) {
            const r = startR + m * matSpacing;
            const mx = dirX * r,
              mz = dirZ * r;

            const mat = new THREE.Mesh(matGeo, matMat);
            mat.position.set(mx, 0.025, mz);
            mat.rotation.y = angle;
            scene.add(mat);

            // person sits cross-legged on the mat, facing the same direction the mat points (toward the room center)
            scene.add(seatedPerson(mx, mz, angle));

            if (m === 0)
              cablePoints.push(new THREE.Vector3(mx * 0.35, 0.03, mz * 0.35));
          }
        }

        // cables radiating from the center pad out toward the first ring of mats
        for (const pt of cablePoints) {
          const geo = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(0, 0.05, 0),
            pt,
          ]);
          scene.add(new THREE.Line(geo, cableMat));
        }

        return scene;
      }

      function setupRenderer(canvas) {
        const renderer = new THREE.WebGLRenderer({
          canvas,
          antialias: true,
          alpha: true,
        });
        const parent = canvas.parentElement;
        function resize() {
          const w = canvas.clientWidth || parent.clientWidth;
          const h = canvas.clientHeight || 340;
          renderer.setSize(w, h, false);
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        }
        resize();
        window.addEventListener("resize", resize);
        return renderer;
      }

      // ---------- Simple orbit/pan/zoom controls (no external deps) ----------
      function attachOrbitControls(camera, canvas, target) {
        const spherical = new THREE.Spherical();
        spherical.setFromVector3(camera.position.clone().sub(target));
        let dragging = false,
          lastX = 0,
          lastY = 0;

        function apply() {
          const offset = new THREE.Vector3().setFromSpherical(spherical);
          camera.position.copy(target).add(offset);
          camera.lookAt(target);
        }

        canvas.addEventListener("pointerdown", (e) => {
          dragging = true;
          lastX = e.clientX;
          lastY = e.clientY;
          canvas.setPointerCapture(e.pointerId);
        });
        canvas.addEventListener("pointerup", () => {
          dragging = false;
        });
        canvas.addEventListener("pointercancel", () => {
          dragging = false;
        });
        canvas.addEventListener("pointermove", (e) => {
          if (!dragging) return;
          const dx = e.clientX - lastX,
            dy = e.clientY - lastY;
          lastX = e.clientX;
          lastY = e.clientY;
          spherical.theta -= dx * 0.007;
          spherical.phi -= dy * 0.007;
          spherical.phi = Math.max(
            0.12,
            Math.min(Math.PI - 0.12, spherical.phi),
          );
          apply();
        });
        canvas.addEventListener(
          "wheel",
          (e) => {
            e.preventDefault();
            spherical.radius *= 1 + e.deltaY * 0.001;
            spherical.radius = Math.max(2, Math.min(60, spherical.radius));
            apply();
          },
          { passive: false },
        );
      }

      function attachTopControls(camera, canvas, target) {
        let dragging = false,
          lastX = 0,
          lastY = 0;

        function apply() {
          camera.position.x = target.x;
          camera.position.z = target.z;
          camera.lookAt(target);
        }

        canvas.addEventListener("pointerdown", (e) => {
          dragging = true;
          lastX = e.clientX;
          lastY = e.clientY;
          canvas.setPointerCapture(e.pointerId);
        });
        canvas.addEventListener("pointerup", () => {
          dragging = false;
        });
        canvas.addEventListener("pointercancel", () => {
          dragging = false;
        });
        canvas.addEventListener("pointermove", (e) => {
          if (!dragging) return;
          const dx = e.clientX - lastX,
            dy = e.clientY - lastY;
          lastX = e.clientX;
          lastY = e.clientY;
          const panScale = 0.03 / camera.zoom;
          target.x -= dx * panScale;
          target.z -= dy * panScale;
          apply();
        });
        canvas.addEventListener(
          "wheel",
          (e) => {
            e.preventDefault();
            camera.zoom *= 1 - e.deltaY * 0.001;
            camera.zoom = Math.max(0.3, Math.min(6, camera.zoom));
            camera.updateProjectionMatrix();
          },
          { passive: false },
        );
      }

      const scene1 = buildScene();

      // Main render: front isometric view of the meditation room
      const c1 = document.getElementById("c1");
      const r1 = setupRenderer(c1);
      const cam1 = new THREE.PerspectiveCamera(
        48,
        c1.clientWidth / c1.clientHeight,
        0.1,
        100,
      );
      cam1.position.set(-10, 9, -10);
      const target1 = new THREE.Vector3(0, 1, 0);
      cam1.lookAt(target1);
      attachOrbitControls(cam1, c1, target1);
      let scrollProgress = 0;

      window.addEventListener("message", (event) => {
        if (event.data?.type !== "immersia-scroll") return;

        scrollProgress = Math.max(0, Math.min(1, event.data.progress));
      });
      function animate() {
        requestAnimationFrame(animate);

        const p = scrollProgress;

        const angle = Math.PI - p * Math.PI * 1.5;

        const radius = 13;

        // Orbit around the actual center of the room
        const centerX = 0;
        const centerZ = 10.5;

        cam1.position.x = centerX + Math.sin(angle) * radius;
        cam1.position.z = centerZ + Math.cos(angle) * radius;
        cam1.position.y = 8 + Math.sin(p * Math.PI * 2) * 3.5;

        const lookTarget = target1.clone();

        lookTarget.y -= Math.sin(p * Math.PI * 2) * 0.15;

        cam1.lookAt(lookTarget);

        r1.render(scene1, cam1);
      }
      animate();
    </script>
  </body>
</html>
