<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Venue 3D Render — Three Angles</title>
  <style>
    :root {
      --bg: transparent;
      --panel: transparent;
      --line: #d8d8d8;
      --text: #111111;
      --muted: #555555;
      --accent: #000000;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', monospace;
      padding: 0;
    }

    h1 {
      font-size: 15px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 4px 0;
      font-weight: 600;
    }

    .subtitle {
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 20px 0;
    }

    .subtitle b {
      color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .panel {
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100vh;
      touch-action: none;
      cursor: grab;
      filter: grayscale(1) contrast(1.05);
    }

    canvas:active {
      cursor: grabbing;
    }
  </style>
</head>

  <script>
    // ---------- Real human base mesh (from uploaded FBX, split into rigged parts) ----------
    const BODY_PARTS = JSON.parse(document.getElementById('body-parts-data').textContent);

    function b64ToFloat32(b64) {
      const bin = atob(b64);
      const buf = new ArrayBuffer(bin.length);
      const view = new Uint8Array(buf);
      for (let i = 0; i < bin.length; i++) view[i] = bin.charCodeAt(i);
      return new Float32Array(buf);
    }
    function b64ToUint32(b64) {
      const bin = atob(b64);
      const buf = new ArrayBuffer(bin.length);
      const view = new Uint8Array(buf);
      for (let i = 0; i < bin.length; i++) view[i] = bin.charCodeAt(i);
      return new Uint32Array(buf);
    }

    function buildBodyGeometries() {
      const parts = {};
      for (const name of ['torso', 'legs', 'head', 'armL', 'armR']) {
        const d = BODY_PARTS[name];
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(b64ToFloat32(d.pos_b64), 3));
        geo.setAttribute('normal', new THREE.BufferAttribute(b64ToFloat32(d.norm_b64), 3));
        geo.setIndex(new THREE.BufferAttribute(b64ToUint32(d.idx_b64), 1));
        parts[name] = { geometry: geo, pivot: d.pivot };
      }
      return parts;
    }

    // ---------- Shared scene builder ----------
    const ROOM_DEPTH = 21; // z
    const ROOM_WIDTH = 6;  // x
    const WALL_H = 5;

    function buildScene() {
      const scene = new THREE.Scene();
      scene.background = null;

      // lights
      const hemi = new THREE.HemisphereLight(0xffffff, 0x333333, 0.9);
      scene.add(hemi);
      const dir = new THREE.DirectionalLight(0xffffff, 0.8);
      dir.position.set(8, 14, 6);
      scene.add(dir);
      const dir2 = new THREE.DirectionalLight(0xffffff, 0.35);
      dir2.position.set(-10, 6, -8);
      scene.add(dir2);

      const wallMat = new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.9, metalness: 0.05, transparent: true, opacity: 0.35, depthWrite: false });
      const wallLineMat = new THREE.LineBasicMaterial({ color: 0x000000 });
      const floorMat = new THREE.MeshStandardMaterial({ color: 0xf2f2f2, roughness: 1 });

      // Floor: centered at origin, x in [-3,3], z in [0,21]
      const floorGeo = new THREE.PlaneGeometry(ROOM_WIDTH, ROOM_DEPTH);
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.set(0, 0, ROOM_DEPTH / 2);
      scene.add(floor);

      // floor grid (1m)
      const grid = new THREE.GridHelper(Math.max(ROOM_WIDTH, ROOM_DEPTH), Math.max(ROOM_WIDTH, ROOM_DEPTH), 0x222222, 0xbbbbbb);
      grid.position.set(0, 0.01, ROOM_DEPTH / 2);
      scene.add(grid);

      // Walls (thin boxes) - left, right, back (far end z=21), front has door gap
      const wallThk = 0.2;
      function addEdges(mesh) {
        const edges = new THREE.EdgesGeometry(mesh.geometry);
        const line = new THREE.LineSegments(edges, wallLineMat);
        line.position.copy(mesh.position);
        line.rotation.copy(mesh.rotation);
        scene.add(line);
      }

      const leftWall = new THREE.Mesh(new THREE.BoxGeometry(wallThk, WALL_H, ROOM_DEPTH), wallMat);
      leftWall.position.set(-ROOM_WIDTH / 2, WALL_H / 2, ROOM_DEPTH / 2);
      scene.add(leftWall);
      addEdges(leftWall);

      const rightWall = new THREE.Mesh(new THREE.BoxGeometry(wallThk, WALL_H, ROOM_DEPTH), wallMat);
      rightWall.position.set(ROOM_WIDTH / 2, WALL_H / 2, ROOM_DEPTH / 2);
      scene.add(rightWall);
      addEdges(rightWall);

      const backWall = new THREE.Mesh(new THREE.BoxGeometry(ROOM_WIDTH, WALL_H, wallThk), wallMat);
      backWall.position.set(0, WALL_H / 2, ROOM_DEPTH);
      scene.add(backWall);
      addEdges(backWall);

      // front wall with door gap (two segments)
      const doorW = 1.6;
      const segW = (ROOM_WIDTH - doorW) / 2;
      const frontL = new THREE.Mesh(new THREE.BoxGeometry(segW, WALL_H * 0.5, wallThk), wallMat);
      frontL.position.set(-(doorW / 2 + segW / 2), WALL_H * 0.25, 0);
      scene.add(frontL);
      const frontR = new THREE.Mesh(new THREE.BoxGeometry(segW, WALL_H * 0.5, wallThk), wallMat);
      frontR.position.set((doorW / 2 + segW / 2), WALL_H * 0.25, 0);
      scene.add(frontR);

      // truss at back near ceiling with small lights, echoing the sketch
      const trussMat = new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.6, metalness: 0.4 });
      const truss = new THREE.Mesh(new THREE.BoxGeometry(ROOM_WIDTH * 0.9, 0.15, 0.15), trussMat);
      truss.position.set(0, WALL_H - 0.3, ROOM_DEPTH - 1.5);
      scene.add(truss);
      for (let i = 0; i < 7; i++) {
        const lx = -ROOM_WIDTH * 0.4 + i * (ROOM_WIDTH * 0.8 / 6);
        const lamp = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.18, 10), trussMat);
        lamp.position.set(lx, WALL_H - 0.5, ROOM_DEPTH - 1.5);
        scene.add(lamp);
      }

      // Platforms A (back wall) and B (front wall) - opposite 6m walls, spanning room width
      const platMatA = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.8 });
      const platMatB = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.8 });

      const platSpan = ROOM_WIDTH - 0.3; // spans the 6m wall, small margin
      const platDepth = 1.4;             // how far it extends into the room
      const platH = 0.6;                 // riser height

      const platA = new THREE.Mesh(new THREE.BoxGeometry(platSpan, platH, platDepth), platMatA);
      platA.position.set(0, platH / 2, ROOM_DEPTH - platDepth / 2 - 0.2);
      scene.add(platA);

      const platB = new THREE.Mesh(new THREE.BoxGeometry(platSpan, platH, platDepth), platMatB);
      platB.position.set(0, platH / 2, platDepth / 2 + 0.2);
      scene.add(platB);

      // Mainstage 4x2, centered, floor area (front-mid)
      const stageMat = new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.7 });
      const stageH = 0.5;
      const stage = new THREE.Mesh(new THREE.BoxGeometry(4, stageH, 2), stageMat);
      stage.position.set(0, stageH / 2, ROOM_DEPTH * 0.42);
      scene.add(stage);

      const STAGE_X = 0, STAGE_Z = ROOM_DEPTH * 0.42; // crowd faces this point

      // Crowd figures — built from the uploaded low-poly human base mesh (FBX),
      // split into torso/legs/head/arms so the arms can be posed per-instance for cheering motions.
      const bodyParts = buildBodyGeometries();

      function person(x, y, z, scale) {
        if (scale === undefined) scale = 0.92 + Math.random() * 0.18; // natural height variance
        // subtle per-person tint so 400 figures don't look like clones, but stays in the pale/white family
        const tint = 0xF0F0F0 + Math.floor(Math.random() * 0x0F0F0F);
        const mat = new THREE.MeshStandardMaterial({ color: tint, roughness: 0.75, flatShading: true });

        const g = new THREE.Group();
        g.scale.setScalar(scale);

        const torso = new THREE.Mesh(bodyParts.torso.geometry, mat);
        const legs = new THREE.Mesh(bodyParts.legs.geometry, mat);
        const head = new THREE.Mesh(bodyParts.head.geometry, mat);
        g.add(torso, legs, head);

        // arms attach at their shoulder pivot so they can rotate like a joint
        const pivotL = bodyParts.armL.pivot;
        const pivotR = bodyParts.armR.pivot;

        const shoulderL = new THREE.Group();
        shoulderL.position.set(pivotL[0], pivotL[1], pivotL[2]);
        shoulderL.add(new THREE.Mesh(bodyParts.armL.geometry, mat));
        g.add(shoulderL);

        const shoulderR = new THREE.Group();
        shoulderR.position.set(pivotR[0], pivotR[1], pivotR[2]);
        shoulderR.add(new THREE.Mesh(bodyParts.armR.geometry, mat));
        g.add(shoulderR);

        // angle: -PI/2 = arm down at side (default rest), 0 = arm out horizontal, +PI/2 = arm straight up
        const jitter = () => (Math.random() - 0.5) * 0.18;
        // weighted so most people are relaxed/arms-down, fewer are actively cheering
        const roll = Math.random();
        const pose = roll < 0.40 ? 4 : roll < 0.60 ? 0 : roll < 0.75 ? 1 : roll < 0.90 ? 3 : 2;
        let angleL, angleR, leanX = 0;

        if (pose === 0) { // both arms straight up - big cheer
          angleL = Math.PI * 0.46 + jitter(); angleR = Math.PI * 0.46 + jitter();
        } else if (pose === 1) { // one arm up (fist pump), one relaxed down
          angleL = Math.PI * 0.47 + jitter(); angleR = -Math.PI * 0.42 + jitter();
        } else if (pose === 2) { // arms raised partway out, gentle sway
          angleL = -Math.PI * 0.2 + jitter(); angleR = -Math.PI * 0.2 + jitter();
        } else if (pose === 3) { // arms raised forward/up, phone-recording lean
          angleL = Math.PI * 0.32 + jitter(); angleR = Math.PI * 0.32 + jitter(); leanX = 0.3;
        } else { // relaxed, arms down at sides (default)
          angleL = -Math.PI * 0.46 + jitter(); angleR = -Math.PI * 0.46 + jitter();
        }

        shoulderL.rotation.z = -angleL; // side = -1
        shoulderR.rotation.z = angleR;  // side = +1
        shoulderL.rotation.x = leanX;
        shoulderR.rotation.x = leanX;

        g.position.set(x, y, z);
        // face toward the stage, with a little natural jitter
        const dx = STAGE_X - x, dz = STAGE_Z - z;
        g.rotation.y = Math.atan2(dx, dz) + Math.PI + (Math.random() - 0.5) * 0.25;
        return g;
      }

      // row of people standing on platform A (back wall) and B (front wall), facing inward
      const platRows = 2;
      const platCols = 20;
      for (let r = 0; r < platRows; r++) {
        for (let i = 0; i < platCols; i++) {
          const x = -platSpan / 2 + 0.3 + i * ((platSpan - 0.6) / (platCols - 1)) + (Math.random() - 0.5) * 0.12;
          const jitter = (Math.random() - 0.5) * 0.08;
          const zA = ROOM_DEPTH - platDepth + 0.3 + r * 0.55 + jitter;
          const zB = platDepth - 0.3 - r * 0.55 + jitter;
          scene.add(person(x, platH, zA));
          scene.add(person(x, platH, zB));
        }
      }
      // platform people count: 2 * 2 * 20 = 80

      // floor crowd, between the two platforms, avoiding stage footprint, densely packed
      const stageZ = ROOM_DEPTH * 0.42;
      const stageZmin = stageZ - 1, stageZmax = stageZ + 1;
      const floorZMin = platDepth + 0.5;
      const floorZMax = ROOM_DEPTH - platDepth - 0.5;
      const cols = 13;
      const rowStep = 0.6;
      const floorRows = Math.floor((floorZMax - floorZMin) / rowStep);
      for (let r = 0; r <= floorRows; r++) {
        const z = floorZMin + r * rowStep;
        if (z > stageZmin - 0.5 && z < stageZmax + 0.5) continue; // leave gap around stage
        for (let c = 0; c < cols; c++) {
          const x = -2.75 + c * (5.5 / (cols - 1)) + (Math.random() - 0.5) * 0.25;
          const zj = z + (Math.random() - 0.5) * 0.2;
          scene.add(person(x, 0, zj));
        }
      }

      return scene;
    }

    function setupRenderer(canvas) {
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true,
      });
      const parent = canvas.parentElement;
      function resize() {
        const w = canvas.clientWidth || parent.clientWidth;
        const h = canvas.clientHeight || 340;
        renderer.setSize(w, h, false);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      }
      resize();
      window.addEventListener('resize', resize);
      return renderer;
    }

    // ---------- Simple orbit/pan/zoom controls (no external deps) ----------
    function attachOrbitControls(camera, canvas, target) {
      const spherical = new THREE.Spherical();
      spherical.setFromVector3(camera.position.clone().sub(target));
      let dragging = false, lastX = 0, lastY = 0;

      function apply() {
        const offset = new THREE.Vector3().setFromSpherical(spherical);
        camera.position.copy(target).add(offset);
        camera.lookAt(target);
      }

      canvas.addEventListener('pointerdown', e => {
        dragging = true; lastX = e.clientX; lastY = e.clientY;
        canvas.setPointerCapture(e.pointerId);
      });
      canvas.addEventListener('pointerup', () => { dragging = false; });
      canvas.addEventListener('pointercancel', () => { dragging = false; });
      canvas.addEventListener('pointermove', e => {
        if (!dragging) return;
        const dx = e.clientX - lastX, dy = e.clientY - lastY;
        lastX = e.clientX; lastY = e.clientY;
        spherical.theta -= dx * 0.007;
        spherical.phi -= dy * 0.007;
        spherical.phi = Math.max(0.12, Math.min(Math.PI - 0.12, spherical.phi));
        apply();
      });
      canvas.addEventListener('wheel', e => {
        e.preventDefault();
        spherical.radius *= (1 + e.deltaY * 0.001);
        spherical.radius = Math.max(2, Math.min(60, spherical.radius));
        apply();
      }, { passive: false });
    }

    function attachTopControls(camera, canvas, target) {
      let dragging = false, lastX = 0, lastY = 0;

      function apply() {
        camera.position.x = target.x;
        camera.position.z = target.z;
        camera.lookAt(target);
      }

      canvas.addEventListener('pointerdown', e => {
        dragging = true; lastX = e.clientX; lastY = e.clientY;
        canvas.setPointerCapture(e.pointerId);
      });
      canvas.addEventListener('pointerup', () => { dragging = false; });
      canvas.addEventListener('pointercancel', () => { dragging = false; });
      canvas.addEventListener('pointermove', e => {
        if (!dragging) return;
        const dx = e.clientX - lastX, dy = e.clientY - lastY;
        lastX = e.clientX; lastY = e.clientY;
        const panScale = 0.03 / camera.zoom;
        target.x -= dx * panScale;
        target.z -= dy * panScale;
        apply();
      });
      canvas.addEventListener('wheel', e => {
        e.preventDefault();
        camera.zoom *= (1 - e.deltaY * 0.001);
        camera.zoom = Math.max(0.3, Math.min(6, camera.zoom));
        camera.updateProjectionMatrix();
      }, { passive: false });
    }

    const scene1 = buildScene();

    // Main render: Front isometric (matches sketch angle)
    const c1 = document.getElementById('c1');
    const r1 = setupRenderer(c1);
    const cam1 = new THREE.PerspectiveCamera(45, c1.clientWidth / (c1.clientHeight || window.innerHeight), 0.1, 100);
    cam1.position.set(-9, 8, -6);
    const target1 = new THREE.Vector3(0, 1.5, ROOM_DEPTH / 2);
    cam1.lookAt(target1);
    attachOrbitControls(cam1, c1, target1);

    window.addEventListener('resize', () => {
      cam1.aspect = c1.clientWidth / c1.clientHeight;
      cam1.updateProjectionMatrix();
    });

    let scrollProgress = 0;

    window.addEventListener('message', (event) => {
      if (event.data?.type !== 'immersia-scroll') return;

      scrollProgress = Math.max(
        0,
        Math.min(1, event.data.progress)
      );
    });

    function animate() {
      requestAnimationFrame(animate);

      const p = scrollProgress;

      const angle = p * Math.PI * 1.5;

      // Keep enough distance to see the entire room
      const radius = 35;

      cam1.position.x = Math.sin(angle) * radius;
      cam1.position.z = Math.cos(angle) * radius - 4;
      cam1.position.y = 8 + Math.sin(p * Math.PI * 2) * 0.5;

      const lookTarget = target1.clone();

      // Very subtle tilt
      lookTarget.y += Math.sin(p * Math.PI * 2) * 0.15;

      cam1.lookAt(lookTarget);

      r1.render(scene1, cam1);
    }
    animate();
  </script>
</body>
